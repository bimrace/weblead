# Netlify configuration - static site, no build step required.
# Generated by _source/build.py. Do not edit in place.

[build]
  publish = "."

[[redirects]]
  from = "/capabilities"
  to = "/engineering.html"
  status = 301
  force = true

[[redirects]]
  from = "/capabilities.html"
  to = "/engineering.html"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/engineering.html"
  status = 301
  force = true

[[redirects]]
  from = "/services/"
  to = "/engineering.html"
  status = 301
  force = true

[[redirects]]
  from = "/industries/"
  to = "/industries.html"
  status = 301
  force = true

[[redirects]]
  from = "/locations/"
  to = "/locations.html"
  status = 301
  force = true

[[redirects]]
  from = "/technology/"
  to = "/technology.html"
  status = 301
  force = true

[[redirects]]
  from = "/_source/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
