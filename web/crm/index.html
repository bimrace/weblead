<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BIMRACE — Operations Console</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crm.css">
</head>
<body>

<!-- Sign in ---------------------------------------------------------------->
<section id="login" class="login" hidden>
  <form id="login-form" class="login__box">
    <h1>BIMRACE Operations</h1>
    <p class="muted">Internal access only.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" required>
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" required>
    <p id="login-error" class="alert" role="alert"></p>
    <button id="login-btn" class="btn btn--primary" type="submit">Sign in</button>
  </form>
</section>

<!-- Console ---------------------------------------------------------------->
<div id="app" hidden>
  <aside class="side">
    <p class="brand">BIMRACE<span>OPS</span></p>
    <nav class="nav" aria-label="Console">
      <a href="#/">Dashboard</a>
      <a href="#/leads">Leads</a>
      <a href="#/pipeline">Pipeline</a>
      <a href="#/followups">Follow-ups</a>
    </nav>
    <div class="side__foot">
      <p id="me" class="muted"></p>
      <button id="signout" class="btn btn--sm">Sign out</button>
    </div>
  </aside>
  <main id="view" class="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="app.js"></script>
</body>
</html>
